name: CI

# 仅在 Actions 页面手动触发，避免每次推送都跑完整矩阵
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore EssenceL10n.slnx

      - name: Build
        run: dotnet build EssenceL10n.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/EssenceL10n.Core.Tests/EssenceL10n.Core.Tests.csproj -c Release --no-build

  catalogs:
    name: catalog integrity
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every catalog against the English baseline
        shell: pwsh
        run: pwsh -NoProfile -File build/check-catalogs.ps1

  gui:
    name: GUI assets & i18n
    runs-on: windows-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build GUI
        run: dotnet build src/EssenceL10n.App/EssenceL10n.App.csproj -c Release

      - name: Verify icon assets and i18n resources
        shell: pwsh
        run: |
          $missing = 0
          foreach ($f in 'Assets/app.ico','Assets/icon-256.png','Assets/icon-64.png','Assets/icon-32.png','Assets/icon-16.png') {
              if (-not (Test-Path (Join-Path 'src/EssenceL10n.App' $f))) {
                  Write-Host "::error::missing src/EssenceL10n.App/$f"
                  $missing = 1
              }
          }
          foreach ($lang in 'en','zh-Hans','zh-Hant','ja','de','ru','es') {
              if (-not (Test-Path "src/EssenceL10n.App/i18n/$lang.json")) {
                  Write-Host "::error::missing i18n/$lang.json"
                  $missing = 1
              }
          }
          if ($missing -ne 0) { exit 1 }
          Write-Host 'icon assets and all 7 i18n resources present'

  package:
    name: package (zip)
    runs-on: windows-latest
    needs: [catalogs, build-test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        shell: pwsh
        run: pwsh -NoProfile -File build/pack.ps1 -Version 0.0.0-ci

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EssenceL10n-ci-zip
          path: publish/EssenceL10n-*-win-x64.zip
          if-no-files-found: error
          retention-days: 7
