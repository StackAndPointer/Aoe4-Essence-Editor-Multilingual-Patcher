name: Release

# 打 tag（v1.2.3）或手动填版本号触发
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.0.0 (no leading v)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: pack & publish
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
              $version = '${{ github.event.inputs.version }}'.TrimStart('v')
          } else {
              $version = '${{ github.ref_name }}'.TrimStart('v')
          }
          if (-not $version) { Write-Host '::error::cannot resolve version'; exit 1 }
          Write-Host "version=$version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Catalog integrity
        shell: pwsh
        run: pwsh -NoProfile -File build/check-catalogs.ps1

      - name: Test
        run: dotnet test tests/EssenceL10n.Core.Tests/EssenceL10n.Core.Tests.csproj -c Release

      - name: Install Velopack CLI
        shell: pwsh
        run: |
          dotnet tool install --global vpk
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Pack
        shell: pwsh
        run: pwsh -NoProfile -File build/pack.ps1 -Version '${{ steps.version.outputs.version }}' -Velopack -GithubRepo '${{ github.repository }}'

      - name: Create or update the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            publish/EssenceL10n-*-win-x64.zip
            publish/velopack/EssenceL10n-win-Setup.exe
            publish/velopack/EssenceL10n-win-Portable.zip
            publish/velopack/EssenceL10n-*-full.nupkg
            publish/velopack/releases.win.json
            publish/velopack/assets.win.json
            publish/velopack/RELEASES
